# ship.conf — this repo's opt-in to an approval gate. The gate reads this file, the register it names and
# .agents/required-checks.tsv from the default branch on GitHub, never from a checkout. A PR whose paths are all
# unprotected may be merged unattended on green CI for its exact head; a PR touching a protected path waits for
# the maintainer. Merge-only: no deploy commands, because installing the tool (`just install --apply`) and its
# scheduled units stays a manual step. This file, the register and .github/** are always protected.
repo VytCepas/projects-orchestrator
workflow ci.yml
# merge commits keep the maintainer as author of every commit an automated merge lands
method merge-commit
protected .agents/protected-paths.tsv
